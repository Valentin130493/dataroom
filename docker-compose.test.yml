services:
  postgres:
    image: postgres:16-alpine
    container_name: dataroom-test-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dataroom_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
